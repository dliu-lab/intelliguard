[project]
name = "agent-governance-platform"
version = "0.1.0"
description = "Runtime governance SDK and API for enterprise AI agents."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "llama-index-core>=0.12.0",
  "llama-index-embeddings-ollama>=0.5.0",
  "llama-index-readers-file>=0.4.0",
  "opentelemetry-api>=1.41.1",
  "opentelemetry-exporter-otlp-proto-http>=1.41.1",
  "opentelemetry-instrumentation-fastapi>=0.62b1",
  "opentelemetry-sdk>=1.41.1",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.0",
  "sqlalchemy>=2.0.0",
  "tree-sitter>=0.25.2 ; platform_machine != 'arm64' or sys_platform != 'darwin'",
  "tree-sitter-language-pack>=1.6.3 ; platform_machine != 'arm64' or sys_platform != 'darwin'",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
langgraph = [
  "langgraph>=0.2.0",
]
strands = [
  "strands-agents>=1.0.0",
]
temporal = [
  "temporalio>=1.8.0",
]

[project.scripts]
governance-agent = "examples.customer_support_cli:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_governance*", "api*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py311"
