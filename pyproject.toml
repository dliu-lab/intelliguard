[project]
name = "agent-governance-platform"
version = "0.1.0"
description = "Runtime governance SDK and API for enterprise AI agents."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
governance-agent = "examples.customer_support_cli:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_governance*", "api*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py311"
