services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: governance
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: governance
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance -d governance"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://governance:governance@postgres:5432/governance
      POLICY_PATH: policies/policy.yaml
      AUTO_INIT_DB: "true"
      SEED_DEMO_DATA: "false"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      KB_UPLOAD_DIR: /app/data/kb_uploads
      KB_EMBED_DIMENSION: "768"
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: intelliguard-api
      OTEL_SERVICE_VERSION: "0.1.0"
      OTEL_TRACES_EXPORTER: otlp
      DEPLOYMENT_ENVIRONMENT: local
      WORKFLOW_RUNNER_HEALTH_URL: http://workflow-runner:8010/health
    volumes:
      - kb_uploads:/app/data/kb_uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  kb-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "intelliguard.workers.knowledge"]
    environment:
      DATABASE_URL: postgresql+psycopg://governance:governance@postgres:5432/governance
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      KB_UPLOAD_DIR: /app/data/kb_uploads
      KB_EMBED_DIMENSION: "768"
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: intelliguard-kb-worker
      OTEL_SERVICE_VERSION: "0.1.0"
      OTEL_TRACES_EXPORTER: otlp
      DEPLOYMENT_ENVIRONMENT: local
    volumes:
      - kb_uploads:/app/data/kb_uploads
    depends_on:
      postgres:
        condition: service_healthy

  workflow-runner:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "intelliguard.workers.runtime"]
    environment:
      DATABASE_URL: postgresql+psycopg://governance:governance@postgres:5432/governance
      POLICY_PATH: policies/policy.yaml
      AUTO_INIT_DB: "true"
      SEED_DEMO_DATA: "false"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      KB_UPLOAD_DIR: /app/data/kb_uploads
      KB_EMBED_DIMENSION: "768"
      WORKFLOW_RUNNER_POLL_SECONDS: "2"
      WORKFLOW_RUNNER_HEALTH_PORT: "8010"
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: intelliguard-workflow-runner
      OTEL_SERVICE_VERSION: "0.1.0"
      OTEL_TRACES_EXPORTER: otlp
      DEPLOYMENT_ENVIRONMENT: local
    volumes:
      - kb_uploads:/app/data/kb_uploads
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy

  evaluator-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "intelliguard.workers.evaluator"]
    environment:
      DATABASE_URL: postgresql+psycopg://governance:governance@postgres:5432/governance
      POLICY_PATH: policies/policy.yaml
      AUTO_INIT_DB: "true"
      SEED_DEMO_DATA: "false"
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: intelliguard-evaluator-worker
      OTEL_SERVICE_VERSION: "0.1.0"
      OTEL_TRACES_EXPORTER: otlp
      DEPLOYMENT_ENVIRONMENT: local
    depends_on:
      postgres:
        condition: service_healthy

  event-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "intelliguard.workers.event"]
    environment:
      DATABASE_URL: postgresql+psycopg://governance:governance@postgres:5432/governance
      AUTO_INIT_DB: "true"
      SEED_DEMO_DATA: "false"
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: intelliguard-event-worker
      OTEL_SERVICE_VERSION: "0.1.0"
      OTEL_TRACES_EXPORTER: otlp
      DEPLOYMENT_ENVIRONMENT: local
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "5175:80"
    depends_on:
      - api

volumes:
  postgres_data:
  kb_uploads:
