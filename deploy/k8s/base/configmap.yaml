apiVersion: v1
kind: ConfigMap
metadata:
  name: intelliguard-runtime-config
data:
  POLICY_PATH: /app/policies/policy.yaml
  DEPLOYMENT_ENVIRONMENT: production
  RUNTIME_QUEUE_BACKEND: postgres
  TEMPORAL_ADDRESS: temporal-frontend:7233
  TEMPORAL_TASK_QUEUE: intelliguard-runtime
  WORKFLOW_RUNNER_CONCURRENCY: "4"
  TOOL_GATEWAY_TIMEOUT_MS: "30000"
  MODEL_GATEWAY_ALLOWED_PROVIDERS: openai,azure,ollama
  RUNTIME_MAX_PARALLEL_NODES: "16"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  MAX_DB_CONNECTION_BUDGET: "20"
