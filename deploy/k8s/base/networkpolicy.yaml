apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intelliguard-runtime-boundaries
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 443
